spring:
  application:
    name: fizz-buzz-combo
  datasource:
    url: jdbc:h2:mem:fizzbuzzdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          #OAuth2 / OIDC issuer URI
          # See README for vendor-specific examples
          issuer-uri: ${ISSUER_URI:https://securetoken.google.com/REPLACE_ME}
          expected-audience: ${EXPECTED_AUDIENCE:REPLACE_ME}

  flyway:
    enabled: true
    # PostgreSQL固有の型（ENUM等）を扱うため、必要に応じて設定
    baseline-on-migrate: true

game:
    rules:
        fizz:
            name: fizz
            rarity: common
            tags:
                - multiple
            score: 3
            multiple: 3
        buzz:
            name: buzz
            rarity: common
            tags:
                - multiple
            score: 5
            multiple: 5
        hoge:
            name: hoge
            rarity: common
            tags:
                - multiple
            score: 7
            multiple: 7
        prime:
            name: prime
            rarity: uncommon
            tags:
                - special
            score: 15
        multiple-synergy:
            name: multiple synergy
            rarity: rare
            tags:
                - combo
            multiplier: 2.0
        digit-sum:
            name: digit sum
            rarity: rare
            tags:
                - combo
            multiplier: 2.5